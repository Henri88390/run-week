services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: run_week
      POSTGRES_PASSWORD: run_week
      POSTGRES_DB: run_week
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
