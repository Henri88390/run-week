name: CI

# Vercel Deployment Checks require the "Lint, typecheck and build", "E2E tests" and "Migrate database"
# jobs, so a production deployment is promoted only after its checks pass and its migrations are applied.
on:
  push:
    branches: [qa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-vercel-build.mjs
      - run: node scripts/verify-strava-background.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts a throwaway PostgreSQL container, the app and a Garmin mock; no secrets needed.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  migrate:
    name: Migrate database
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the DIRECT_URL secret; add required reviewers to the environment to approve each run.
    environment: qa
    # Never cancel a running migration; later pushes wait for it.
    concurrency:
      group: migrate-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Set the DIRECT_URL secret in the production environment."
            exit 1
          fi
          npm run db:deploy
