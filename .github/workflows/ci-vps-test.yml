name: CI

# Vercel Deployment Checks require the "Lint, typecheck and build", "E2E tests" and "Migrate database"
# jobs, so a production deployment is promoted only after its checks pass and its migrations are applied.
on:
  push:
    branches: [vps]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-vercel-build.mjs
      - run: node scripts/verify-strava-background.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  migrate:
    name: Migrate database
    needs: checks
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the DIRECT_URL secret; add required reviewers to the environment to approve each run.
    environment: qa
    # Never cancel a running migration; later pushes wait for it.
    concurrency:
      group: migrate-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Set the DIRECT_URL secret in the production environment."
            exit 1
          fi
          npm run db:deploy
